name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Build APK
      run: |
        # প্রজেক্টের যেকোনো জায়গা থেকে gradlew খুঁজে বের করে পারমিশন দিয়ে বিল্ড করবে
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "gradlew" -execdir ./gradlew assembleDebug --stacktrace \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Note-Debug-APK
        path: |
          **/app/build/outputs/apk/debug/*.apk
